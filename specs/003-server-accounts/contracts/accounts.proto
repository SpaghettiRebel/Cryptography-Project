syntax = "proto3";

package cryptochat.v1;

option go_package = "cryptochat/server/api/v1;apiv1";

// Ошибки возвращаются кодом gRPC и google.rpc.ErrorInfo с полем reason.
// Причины перечислены в research.md, раздел R7. Домен: "cryptochat".

service Accounts {
  // ALREADY_EXISTS/LOGIN_TAKEN, INVALID_ARGUMENT/INVALID_LOGIN, INVALID_ARGUMENT/INVALID_PASSWORD
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // UNAUTHENTICATED/INVALID_CREDENTIALS: один ответ для неверного пароля, неизвестного логина
  // и значений вне правил регистрации
  rpc Login(LoginRequest) returns (LoginResponse);
  // Требует сессию в метаданных authorization: Bearer <token>
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// Все методы требуют сессию; без неё UNAUTHENTICATED/UNAUTHENTICATED.
service Contacts {
  // NOT_FOUND/USER_NOT_FOUND, INVALID_ARGUMENT/SELF_REQUEST,
  // ALREADY_EXISTS/ALREADY_CONTACT, ALREADY_EXISTS/DUPLICATE_REQUEST.
  // Встречный запрос сразу создаёт контакт: became_contact = true.
  rpc SendRequest(SendContactRequest) returns (SendContactResponse);
  // NOT_FOUND/REQUEST_NOT_FOUND
  rpc AcceptRequest(ContactLogin) returns (ContactChanged);
  // NOT_FOUND/REQUEST_NOT_FOUND
  rpc RejectRequest(ContactLogin) returns (ContactChanged);
  // NOT_FOUND/CONTACT_NOT_FOUND
  rpc RemoveContact(ContactLogin) returns (ContactChanged);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
  string login = 2;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  // Unix-время окончания сессии в секундах.
  int64 expires_at = 2;
  string user_id = 3;
  string login = 4;
}

message LogoutRequest {}
message LogoutResponse {}

message SendContactRequest {
  string login = 1;
}

message SendContactResponse {
  bool became_contact = 1;
}

message ContactLogin {
  string login = 1;
}

message ContactChanged {}
message ListContactsRequest {}

message UserRef {
  string user_id = 1;
  string login = 2;
}

message ListContactsResponse {
  repeated UserRef contacts = 1;
  repeated UserRef incoming = 2;
  repeated UserRef outgoing = 3;
}
